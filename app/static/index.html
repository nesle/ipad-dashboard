<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Status">
  <title>Home Status</title>
  <style>
    /* Amber phosphor terminal: no external fonts, images or animation. */
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #0d0b07;
      color: #f5b94e;
      font-family: "Courier New", Courier, monospace;
    }

    body {
      padding: 15px 19px;
      text-shadow: 0 0 5px rgba(242, 151, 32, .25);
    }

    /* Static, subtle scanlines evoke a CRT without repaint-heavy effects. */
    body:before {
      content: "";
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      pointer-events: none;
      z-index: 5;
      opacity: .18;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0,
        transparent 3px,
        rgba(0, 0, 0, .55) 4px
      );
    }

    .top {
      overflow: hidden;
      max-width: 1000px;
      margin-bottom: 11px;
      padding-bottom: 8px;
      border-bottom: 1px solid #6d451c;
    }

    .title {
      float: left;
      font-size: 18px;
      font-weight: bold;
      letter-spacing: 2px;
      color: #ffd17b;
    }

    .title:before { content: "> "; color: #ae6c24; }

    .clock {
      float: right;
      color: #ffca69;
      font-size: 18px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .panel {
      max-width: 1000px;
      padding: 11px 13px;
      border: 1px solid #8c591f;
      border-radius: 2px;
      background: #141007;
      box-shadow: inset 0 0 28px rgba(101, 54, 6, .14), 0 0 16px rgba(255, 143, 25, .06);
    }

    .head {
      overflow: hidden;
      margin-bottom: 10px;
      padding-bottom: 7px;
      border-bottom: 1px dashed #62401b;
    }

    .head strong {
      float: left;
      font-size: 13px;
      letter-spacing: 2px;
      color: #ffd17b;
    }

    .head strong:before { content: "[ "; color: #a96a24; }
    .head strong:after { content: " ]"; color: #a96a24; }

    .update {
      float: right;
      font-size: 10px;
      color: #c18c46;
    }

    .line {
      overflow: hidden;
      margin: 8px 0;
    }

    .label {
      float: left;
      width: 60px;
      padding-top: 5px;
      color: #c18c46;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .5px;
    }

    .contents {
      margin-left: 60px;
      min-height: 23px;
    }

    .nodes { overflow: hidden; }

    .node {
      float: left;
      width: 33.333%;
      padding-right: 6px;
    }

    .nodebox {
      overflow: hidden;
      padding: 7px 8px;
      border: 1px solid #5c3a16;
      border-radius: 1px;
      background: #1d160a;
      white-space: nowrap;
    }

    .node-name {
      color: #ffd17b;
      font-size: 12px;
      font-weight: bold;
    }

    .metrics {
      display: block;
      margin-top: 5px;
      color: #d49a4b;
      font-size: 11px;
      white-space: nowrap;
    }

    .dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      margin: 0 6px 0 0;
      border: 1px solid currentColor;
      border-radius: 1px;
      vertical-align: middle;
    }

    /* Preserve five distinct states within the warm monochrome palette. */
    .healthy {
      color: #e6a642;
      background: #e6a642;
      box-shadow: 0 0 6px rgba(245, 173, 56, .55);
    }

    .warning {
      color: #ffe3a2;
      background: #ffe3a2;
      box-shadow: 0 0 8px rgba(255, 227, 162, .7);
    }

    .critical {
      color: #ff643b;
      background: #ff643b;
      box-shadow: 0 0 8px rgba(255, 100, 59, .7);
    }

    .stopped {
      color: #5c4a32;
      background: #332b21;
      box-shadow: none;
    }

    .unknown {
      color: #a07b49;
      background: transparent;
      border-style: dashed;
      box-shadow: none;
    }

    .dots { line-height: 23px; }
    .dots .dot { margin-right: 5px; }

    .ceph-layout {
      display: table;
      width: 100%;
      table-layout: fixed;
    }

    .ceph-bar-cell {
      display: table-cell;
      vertical-align: middle;
    }

    .ceph-percent-cell {
      display: table-cell;
      width: 54px;
      text-align: right;
      vertical-align: middle;
    }

    .bar {
      height: 11px;
      overflow: hidden;
      border: 1px solid #69461f;
      border-radius: 1px;
      background: #2c210f;
    }

    .fill {
      width: 0;
      height: 100%;
      background: repeating-linear-gradient(
        to right,
        #c7852b 0,
        #c7852b 6px,
        #7d501e 6px,
        #7d501e 8px
      );
    }

    .percent {
      color: #ffd17b;
      font-size: 12px;
      line-height: 16px;
      white-space: nowrap;
    }

    .separator {
      margin: 11px 0;
      border-top: 1px dashed #5b3c1b;
    }

    .legend {
      margin-top: 8px;
      color: #bc8947;
      font-size: 10px;
    }

    .legend .dot {
      width: 8px;
      height: 8px;
      margin-left: 10px;
      margin-right: 3px;
    }

    .foot {
      margin-top: 11px;
      color: #987343;
      font-size: 10px;
    }

    .err { color: #ff8a53; }
    .placeholder { color: #947346; font-size: 11px; }

    @media (max-width: 650px) {
      body { padding: 10px; }
      .panel { padding: 10px; }
      .node { width: 100%; margin-bottom: 4px; }
      .nodebox { padding: 5px 8px; }
      .metrics { margin-left: 17px; margin-top: 3px; }
      .label { width: 50px; }
      .contents { margin-left: 50px; }
    }
  </style>
</head>
<body>
  <div class="top">
    <div class="title">HOME STATUS</div>
    <div class="clock" id="clock">--:--</div>
  </div>

  <div class="panel">
    <div class="head">
      <strong>PROXMOX</strong>
      <span class="update" id="updated">Connecting…</span>
    </div>

    <div class="line">
      <div class="label">Nodes</div>
      <div class="contents nodes" id="nodes">
        <span class="placeholder">Waiting for metrics…</span>
      </div>
    </div>

    <div class="separator"></div>

    <div class="line">
      <div class="label">Ceph</div>
      <div class="contents">
        <div class="ceph-layout">
          <div class="ceph-bar-cell">
            <div class="bar"><div class="fill" id="cephfill"></div></div>
          </div>
          <div class="ceph-percent-cell">
            <span class="percent" id="cephval">—</span>
          </div>
        </div>
      </div>
    </div>

    <div class="line">
      <div class="label">NAS</div>
      <div class="contents">
        <div class="ceph-layout">
          <div class="ceph-bar-cell">
            <div class="bar"><div class="fill" id="nasfill"></div></div>
          </div>
          <div class="ceph-percent-cell">
            <span class="percent" id="nasval">—</span>
          </div>
        </div>
      </div>
    </div>

    <div class="separator"></div>

    <div class="line">
      <div class="label">VMs</div>
      <div class="contents dots" id="vms">—</div>
    </div>
    <div class="line">
      <div class="label">LXC</div>
      <div class="contents dots" id="lxc">—</div>
    </div>

    <div class="legend">
      <span class="dot healthy"></span>OK
      <span class="dot warning"></span>Warning
      <span class="dot critical"></span>Critical
      <span class="dot stopped"></span>Stopped
      <span class="dot unknown"></span>Unknown
    </div>
    <div class="foot" id="message">Read-only · Live data from InfluxDB</div>
  </div>

  <script>
    (function () {
      'use strict';

      // ES5 syntax is intentional: the dashboard runs on iOS 9 Safari.
      var REFRESH_MS = 30000;
      var STALE_SECONDS = 120;

      function element(id) {
        return document.getElementById(id);
      }

      function setHtml(id, html) {
        element(id).innerHTML = html;
      }

      function escapeHtml(value) {
        return String(value == null ? '' : value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function formatPercent(value) {
        return typeof value === 'number' ? Math.round(value) + '%' : '—';
      }

      function updateClock() {
        var now = new Date();
        var hours = ('0' + now.getHours()).slice(-2);
        var minutes = ('0' + now.getMinutes()).slice(-2);
        setHtml('clock', hours + ':' + minutes);
      }

      function renderDot(guest) {
        var state = guest.status || 'unknown';
        var title = (guest.name || guest.id || '') + ' · ' + state;
        return '<span class="dot ' + state + '" title="' + escapeHtml(title) + '"></span>';
      }

      function renderNodes(nodes, stale) {
        var html = '';
        var i;
        var node;
        var state;

        for (i = 0; i < nodes.length; i++) {
          node = nodes[i];
          state = stale || !node.online ? 'unknown' : node.status;

          html += '<div class="node"><div class="nodebox">' +
            '<span class="dot ' + state + '"></span>' +
            '<span class="node-name">' + escapeHtml(node.name) + '</span>' +
            '<span class="metrics">CPU ' + formatPercent(node.cpu) +
            ' · RAM ' + formatPercent(node.mem) + '</span>' +
            '</div></div>';
        }

        setHtml('nodes', html || '<span class="placeholder">No node data</span>');
      }

      function renderGuests(id, guests, stale) {
        if (!guests || !guests.length) {
          setHtml(id, '<span class="placeholder">No guests found</span>');
          return;
        }

        var html = '';
        var i;
        for (i = 0; i < guests.length; i++) {
          html += renderDot(stale ? { status: 'unknown', id: guests[i].id } : guests[i]);
        }
        setHtml(id, html);
      }

      function renderStorage(prefix, storage, stale) {
        var percent = storage && storage.percent;
        var available = !stale && typeof percent === 'number';

        setHtml(prefix + 'val', available ? percent.toFixed(1) + '%' : '—');
        element(prefix + 'fill').style.width = available ?
          Math.max(0, Math.min(100, percent)) + '%' : '0%';
      }

      function render(data) {
        var updated = data.updated ? Date.parse(data.updated) / 1000 : 0;
        var stale = !updated || Date.now() / 1000 - updated > STALE_SECONDS;
        var guests = data.guests || {};

        setHtml('updated', data.error ? 'Collector error' :
          stale ? 'Data stale' : 'Updated ' + new Date(data.updated).toLocaleTimeString());

        renderNodes(data.nodes || [], stale);
        renderGuests('vms', guests.qemu, stale);
        renderGuests('lxc', guests.lxc, stale);
        renderStorage('ceph', data.ceph, stale);
        renderStorage('nas', data.nas, stale);

        setHtml('message', data.error ?
          '<span class="err">Collector: ' + escapeHtml(data.error) + '</span>' :
          stale ? '<span class="err">Metrics unavailable or stale</span>' :
          'Read-only · Live data from InfluxDB');
      }

      function loadStatus() {
        var request = new XMLHttpRequest();
        request.open('GET', '/api/status?t=' + new Date().getTime(), true);
        request.onreadystatechange = function () {
          if (request.readyState !== 4) {
            return;
          }
          if (request.status !== 200) {
            setHtml('updated', 'Connection lost');
            setHtml('message', 'Cannot reach dashboard backend');
            return;
          }
          try {
            render(JSON.parse(request.responseText));
          } catch (error) {
            setHtml('message', 'Invalid API response');
          }
        };
        request.send(null);
      }

      updateClock();
      setInterval(updateClock, 1000);
      loadStatus();
      setInterval(loadStatus, REFRESH_MS);
    }());
  </script>
</body>
</html>
